<head>

<title>AI Каталог — карта ИИ-продуктов</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14161f;--mut:#5d6378;--bd:#e3e6f0;--ac:#5b5bf0;--ac2:#e8e8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:1100px;margin:0 auto;padding:40px 20px 12px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}

h1 span{color:var(--ac)}
header p{margin:0;color:var(--mut);max-width:620px}
#theme{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd)}
.bar-in{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;transition:.15s}
.tab:hover{border-color:var(--ac)}
.tab[aria-selected="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
#q:focus{outline:2px solid var(--ac);outline-offset:0}
main{max-width:1100px;margin:0 auto;padding:20px}
.cnt{color:var(--mut);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{margin:0;font-size:20px}
.badge{background:var(--ac2);color:var(--ac);font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.meta{font-size:13px;color:var(--mut);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.meta b{color:var(--tx);font-weight:600}
.card p{margin:0;font-size:14.5px}
.card p small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.go{margin-top:auto;text-align:center;text-decoration:none;background:var(--ac);color:#fff;padding:10px;border-radius:12px;font-weight:600;font-size:14px}
.go:hover{opacity:.9}
.empty{text-align:center;color:var(--mut);padding:50px 0}
footer{max-width:1100px;margin:0 auto;padding:10px 20px 40px;color:var(--mut);font-size:13px}
[hidden]{display:none!important}.card{cursor:pointer}.card:focus-visible{outline:2px solid var(--ac)}
.back{display:inline-block;margin-bottom:16px;color:var(--ac);text-decoration:none;font-weight:600}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#detail h1{font-size:clamp(28px,5vw,40px);margin:0}

.sec h3,#detail>h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sec p{margin:0}
.rel{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.rel a{background:var(--ac2);color:var(--ac);padding:6px 14px;border-radius:999px;text-decoration:none;font-size:14px}
#detail .go{display:block;max-width:360px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}.fact{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}.fact small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}.fact b{font-size:15px;font-weight:600}.note{color:var(--mut);font-size:12px;margin:0 0 14px}
.home{color:inherit;text-decoration:none;cursor:pointer;transition:opacity .15s}.home:hover{opacity:.75}
.art{margin:-18px -18px 4px;height:130px;overflow:hidden;border-radius:18px 18px 0 0}.art svg,.hero svg{display:block;width:100%;height:100%}.card:hover .art svg{transform:scale(1.06)}.hero{aspect-ratio:5/2;max-height:240px;border-radius:20px;overflow:hidden;margin-bottom:16px}
</style>
</head>
